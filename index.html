
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApniVibe - Food & Grocery</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f5;color:#222}
header{background:#087b45;color:white;padding:13px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:bold}
button{border:0;border-radius:8px;padding:10px;cursor:pointer;font-weight:bold}
.headerbtn{background:white;color:#087b45}
.searchbar{margin-top:10px}
.searchbar input{width:100%;padding:12px;border:0;border-radius:8px;font-size:16px}
nav{display:flex;gap:8px;padding:10px;background:white;overflow:auto}
nav button{background:#e8f2eb;color:#123b2a;white-space:nowrap}
nav button.active{background:#087b45;color:white}
main{max-width:1200px;margin:auto;padding:12px}
h2{color:#123b2a}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 7px #0001;min-width:0}
.card img{width:100%;height:145px;object-fit:cover;display:block;background:#eee}
.cardbody{padding:9px}
.card h3{font-size:14px;min-height:34px;margin:4px 0;overflow-wrap:anywhere}
.price{color:#087b45;font-weight:bold;margin:7px 0}
.add{width:100%;background:#087b45;color:white}
.smallbtn{background:#e8f2eb;color:#087b45;margin:3px}
.panel{background:white;padding:14px;border-radius:10px;margin:12px 0}
input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:5px 0;font-size:15px}
.itemrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.qty{display:flex;align-items:center;gap:7px}
.qty button{background:#e8f2eb;color:#087b45}
.hidden{display:none!important}
footer{text-align:center;padding:20px;color:#666}
#notice{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:12px;border-radius:8px;z-index:10}
@media(max-width:600px){
 main{padding:7px}
 .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
 .card{border-radius:6px}
 .card img{height:75px}
 .cardbody{padding:5px}
 .card h3{font-size:10px;min-height:30px}
 .price{font-size:10px;margin:4px 0}
 .add{font-size:10px;padding:7px 1px}
 .logo{font-size:20px}
 header{padding:9px}
}
</style>
</head>
<body>
<header>
 <div class="top">
  <div class="logo">🛍️ ApniVibe</div>
  <div>
   <button class="headerbtn" onclick="showCart()">🛒 Cart <span id="cartCount">0</span></button>
   <button class="headerbtn" onclick="showAccount()">👤 Account</button>
  </div>
 </div>
 <div class="searchbar">
  <input id="search" placeholder="सामान खोजें..." oninput="render()">
 </div>
</header>

<nav>
 <button id="fastTab" class="active" onclick="setPage('fast')">🍔 Fast Food</button>
 <button id="groceryTab" onclick="setPage('grocery')">🛒 Grocery</button>
 <button onclick="showOrders()">📦 My Orders</button>
</nav>

<main>
 <section id="catalog">
  <h2 id="heading">🍔 Fast Food</h2>
  <div id="products" class="grid"></div>
 </section>

 <section id="cartPage" class="hidden">
  <h2>🛒 आपका Cart</h2>
  <div class="panel" id="cartItems"></div>
  <div class="panel">
   <h3>कुल रकम: ₹<span id="cartTotal">0</span></h3>
   <button class="add" onclick="checkout()">Order Place करें</button>
   <button class="smallbtn" onclick="backToShop()">Shopping जारी रखें</button>
  </div>
 </section>

 <section id="accountPage" class="hidden">
  <h2>👤 Account</h2>
  <div class="panel">
   <div id="loggedOut">
    <input id="userName" placeholder="आपका नाम">
    <input id="userPhone" placeholder="मोबाइल नंबर">
    <input id="userEmail" type="email" placeholder="Email (वैकल्पिक)">
    <button class="add" onclick="login()">Login / Save Profile</button>
    <p style="font-size:12px;color:#777">यह demo login है, असली OTP verification नहीं।</p>
   </div>
   <div id="loggedIn" class="hidden">
    <h3>नमस्ते, <span id="profileName"></span></h3>
    <p>मोबाइल: <span id="profilePhone"></span></p>
    <button class="smallbtn" onclick="showOrders()">मेरे Orders</button>
    <button class="smallbtn" onclick="logout()">Logout</button>
   </div>
  </div>
 </section>

 <section id="addressPage" class="hidden">
  <h2>📍 Delivery Address</h2>
  <div class="panel">
   <input id="deliveryName" placeholder="नाम">
   <input id="deliveryPhone" placeholder="मोबाइल नंबर">
   <textarea id="deliveryAddress" rows="4" placeholder="पूरा पता, मकान नंबर, गली, शहर, PIN code"></textarea>
   <button class="smallbtn" onclick="getLocation()">Use Current Live Location</button>
   <button class="add" onclick="placeOrder()">Confirm Demo Order</button>
   <button class="smallbtn" onclick="showCart()">Back to Cart</button>
  </div>
 </section>

 <section id="ordersPage" class="hidden">
  <h2>📦 My Orders</h2>
  <div id="ordersList"></div>
  <button class="smallbtn" onclick="backToShop()">Shopping करें</button>
 </section>
</main>
<footer>ApniVibe © 2026 | Food & Grocery</footer>
<div id="notice"></div>

const products=rawProducts.map((p,i)=>({
 id:i+1,name:p[0],price:p[1],type:p[2],photo:p[3]
}));

let page="fast";
let cart=JSON.parse(localStorage.getItem("apni_cart")||"{}");
let profile=JSON.parse(localStorage.getItem("apni_profile")||"null");
let orders=JSON.parse(localStorage.getItem("apni_orders")||"[]");

function save(){
 localStorage.setItem("apni_cart",JSON.stringify(cart));
 localStorage.setItem("apni_profile",JSON.stringify(profile));
 localStorage.setItem("apni_orders",JSON.stringify(orders));
 updateCount();
}
function notice(msg){
 const el=document.getElementById("notice");
 el.textContent=msg;el.style.display="block";
 setTimeout(()=>el.style.display="none",2200);
}
function updateCount(){
 document.getElementById("cartCount").textContent=
 Object.values(cart).reduce((a,b)=>a+b,0);
}
function hidePages(){
 ["catalog","cartPage","accountPage","addressPage","ordersPage"]
 .forEach(id=>document.getElementById(id).classList.add("hidden"));
}
function setPage(p){
 page=p;hidePages();
 document.getElementById("catalog").classList.remove("hidden");
 document.getElementById("fastTab").classList.toggle("active",p==="fast");
 document.getElementById("groceryTab").classList.toggle("active",p==="grocery");
 document.getElementById("heading").textContent=p==="fast"?"🍔 Fast Food":"🛒 Grocery";
 render();
}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const list=products.filter(p=>
 p.type===page && p.name.toLowerCase().includes(q)
 );
 document.getElementById("products").innerHTML=list.length?list.map(p=>`
 <div class="card">
  <img src="https://loremflickr.com/480/360/${encodeURIComponent(p.photo)}?lock=${p.id}"
   alt="${p.name}" loading="lazy"
   onerror="this.onerror=null;this.src='https://placehold.co/480x360?text=Photo+Unavailable'">
  <div class="cardbody">
   <h3>${p.name}</h3>
   <div class="price">₹${p.price}</div>
   <button class="add" onclick="addCart(${p.id})">Add to Cart</button>
  </div>
 </div>`).join(""):"<p>कोई सामान नहीं मिला।</p>";
}
function addCart(id){
 cart[id]=(cart[id]||0)+1;save();notice("Cart में जोड़ दिया गया");
}
function showCart(){
 hidePages();document.getElementById("cartPage").classList.remove("hidden");renderCart();
}
function renderCart(){
 let total=0,html="";
 products.forEach(p=>{
  let q=cart[p.id]||0;
  if(q){
   total+=p.price*q;
   html+=`<div class="itemrow">
   <div><b>${p.name}</b><br>₹${p.price} × ${q}</div>
   <div class="qty">
   <button onclick="changeQty(${p.id},-1)">−</button>${q}
   <button onclick="changeQty(${p.id},1)">+</button>
   </div></div>`;
  }
 });
 document.getElementById("cartItems").innerHTML=html||"आपका Cart खाली है।";
 document.getElementById("cartTotal").textContent=total;
}
function changeQty(id,n){
 cart[id]=(cart[id]||0)+n;
 if(cart[id]<=0)delete cart[id];
 save();renderCart();
}
function showAccount(){
 hidePages();document.getElementById("accountPage").classList.remove("hidden");updateAccount();
}
function updateAccount(){
 document.getElementById("loggedOut").classList.toggle("hidden",!!profile);
 document.getElementById("loggedIn").classList.toggle("hidden",!profile);
 if(profile){
  document.getElementById("profileName").textContent=profile.name;
  document.getElementById("profilePhone").textContent=profile.phone;
 }
}
function login(){
 const name=document.getElementById("userName").value.trim();
 const phone=document.getElementById("userPhone").value.trim();
 const email=document.getElementById("userEmail").value.trim();
 if(!name||!phone){notice("नाम और मोबाइल नंबर भरें");return}
 profile={name,phone,email};save();updateAccount();notice("Demo profile save हो गई");
}
function logout(){
 profile=null;save();updateAccount();notice("Logout हो गया");
}
function checkout(){
 if(!Object.keys(cart).length){notice("पहले Cart में सामान जोड़ें");return}
 if(!profile){notice("Order करने के लिए पहले Account बनाएं");showAccount();return}
 hidePages();document.getElementById("addressPage").classList.remove("hidden");
 document.getElementById("deliveryName").value=profile.name;
 document.getElementById("deliveryPhone").value=profile.phone;
}
function getLocation(){
 if(!navigator.geolocation){notice("इस browser में location उपलब्ध नहीं");return}
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude,lon=pos.coords.longitude;
  const field=document.getElementById("deliveryAddress");
  field.value=(field.value?field.value+"\n":"")+"GPS Location: "+lat+", "+lon;
  notice("Location मिल गई");
 },()=>notice("Location permission नहीं मिली। पता खुद भरें।"),{enableHighAccuracy:true});
}
function placeOrder(){
 const name=document.getElementById("deliveryName").value.trim();
 const phone=document.getElementById("deliveryPhone").value.trim();
 const address=document.getElementById("deliveryAddress").value.trim();
 if(!name||!phone||!address){notice("पूरा delivery address भरें");return}
 let items=[],total=0;
 products.forEach(p=>{
  const q=cart[p.id]||0;
  if(q){items.push({id:p.id,name:p.name,price:p.price,qty:q});total+=p.price*q}
 });
 if(!items.length){notice("Cart खाली है");return}
 orders.unshift({
  number:"AV"+Date.now(),
  date:new Date().toLocaleString("hi-IN"),
  items,total,address,name,phone,status:"Demo Order"
 });
 cart={};save();hidePages();
 document.getElementById("ordersPage").classList.remove("hidden");
 renderOrders();notice("Demo order save हो गया");
}
function showOrders(){
 hidePages();document.getElementById("ordersPage").classList.remove("hidden");renderOrders();
}
function renderOrders(){
 const el=document.getElementById("ordersList");
 if(!orders.length){el.innerHTML='<div class="panel">अभी कोई Order नहीं है।</div>';return}
 el.innerHTML=orders.map((o,i)=>`
 <div class="panel">
 <b>Order: ${o.number}</b><p>${o.date}</p>
 <p>${o.items.map(x=>x.name+" × "+x.qty).join("<br>")}</p>
 <b>कुल: ₹${o.total}</b><p>Status: ${o.status}</p>
 <p>Address: ${o.address}</p>
 <button class="smallbtn" onclick="reorder(${i})">Reorder</button>
 </div>`).join("");
}
function reorder(i){
 orders[i].items.forEach(x=>{cart[x.id]=(cart[x.id]||0)+x.qty});
 save();showCart();notice("पुराना सामान Cart में जोड़ दिया गया");
}
function backToShop(){setPage(page)}
updateCount();
updateAccount();
render();
</script>
</body>
</html>
