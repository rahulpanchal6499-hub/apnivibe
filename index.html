
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApniVibe V2</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6f8;color:#222}
header{background:#111827;color:white;padding:16px;text-align:center}
header h1{margin:0;color:#22c55e}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:#fff;padding:12px}
button{border:0;border-radius:8px;padding:10px 14px;background:#16a34a;color:white;cursor:pointer}
button:hover{opacity:.85}
.secondary{background:#374151}
.danger{background:#dc2626}
.container{max-width:1100px;margin:auto;padding:15px}
input,select{padding:11px;border:1px solid #ddd;border-radius:8px;width:100%;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:white;padding:12px;border-radius:12px;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.price{color:#16a34a;font-weight:bold}
.panel{background:white;padding:16px;border-radius:12px;margin:12px 0}
.hidden{display:none}
h2{margin-top:10px}
small{color:#666}
</style>
</head>

<body>

<header>
<h1>ApniVibe</h1>
<p>Apna Shopping • Apni Delivery</p>
</header>

<nav>
<button onclick="show('shop')">Customer Shop</button>
<button onclick="show('login')">Admin / Shopkeeper</button>
<button onclick="show('cart')">🛒 Cart (<span id="count">0</span>)</button>
<button onclick="show('myorders')">My Orders</button>
</nav>

<div class="container">

<!-- CUSTOMER SHOP -->
<section id="shop">
<h2>🛍️ ApniVibe Shopping</h2>
<input id="search" placeholder="सामान खोजें..." oninput="renderProducts()">
<select id="category" onchange="renderProducts()">
<option value="All">सभी सामान</option>
<option value="Fast Food">Fast Food</option>
<option value="Grocery">Grocery</option>
</select>
<div class="grid" id="products"></div>
</section>

<!-- CART -->
<section id="cart" class="hidden">
<h2>🛒 आपका Cart</h2>
<div id="cartitems"></div>
<h3 id="total"></h3>
<div class="panel">
<h3>Delivery Details</h3>
<input id="customer" placeholder="आपका नाम">
<input id="phone" placeholder="मोबाइल नंबर" type="tel">
<input id="address" placeholder="पूरा Delivery Address">
<button onclick="placeOrder()">Place Order</button>
</div>
</section>

<!-- MY ORDERS -->
<section id="myorders" class="hidden">
<h2>📦 My Orders</h2>
<div id="myorderlist"></div>
</section>

<!-- LOGIN -->
<section id="login" class="hidden">
<h2>🔐 Admin / Shopkeeper Login</h2>
<div class="panel">
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p><small>Demo Admin: admin / 1234</small></p>
<p><small>Demo Shopkeeper: shop / 1234</small></p>
</div>
</section>

<!-- ADMIN -->
<section id="admin" class="hidden">
<h2>👑 Admin Panel</h2>
<button onclick="logout()" class="danger">Logout</button>
<div class="panel">
<h3>All Orders</h3>
<div id="adminorders"></div>
</div>
<div class="panel">
<h3>Products Add करें</h3>
<input id="pname" placeholder="Product Name">
<input id="pprice" type="number" placeholder="Price ₹">
<select id="pcat">
<option>Fast Food</option>
<option>Grocery</option>
</select>
<input id="pimg" placeholder="Image URL (optional)">
<button onclick="addProduct()">Add Product</button>
</div>
<div class="panel">
<h3>Products Manage</h3>
<div id="adminproducts"></div>
</div>
</section>

<!-- SHOPKEEPER -->
<section id="seller" class="hidden">
<h2>🏪 Shopkeeper Panel</h2>
<button onclick="logout()" class="danger">Logout</button>
<div class="panel">
<h3>Customer Orders</h3>
<div id="sellerorders"></div>
</div>
</section>

</div>

<script>
const defaultProducts=[
{id:1,name:"Burger",price:80,cat:"Fast Food",img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"},
{id:2,name:"Pizza",price:150,cat:"Fast Food",img:"https://images.unsplash.com/photo- pizza?w=500"},
{id:3,name:"French Fries",price:70,cat:"Fast Food",img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500"},
{id:4,name:"Cold Drink",price:40,cat:"Fast Food",img:"https://images.unsplash.com/photo-1581006852262-e4307cf6283a?w=500"},
{id:5,name:"Rice 1 KG",price:60,cat:"Grocery",img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500"},
{id:6,name:"Wheat 1 KG",price:35,cat:"Grocery",img:"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=500"},
{id:7,name:"Sugar 1 KG",price:45,cat:"Grocery",img:"https://images.unsplash.com/photo-1581441363689-1f3c3c2e7b8?w=500"},
{id:8,name:"Milk",price:30,cat:"Grocery",img:"https://images.unsplash.com/photo-1563636619-e9143da7973b?w=500"}
];

let products=JSON.parse(localStorage.getItem("av_products"))||defaultProducts;
let cart=JSON.parse(localStorage.getItem("av_cart"))||[];
let orders=JSON.parse(localStorage.getItem("av_orders"))||[];
let role="";

function save(){
localStorage.setItem("av_products",JSON.stringify(products));
localStorage.setItem("av_cart",JSON.stringify(cart));
localStorage.setItem("av_orders",JSON.stringify(orders));
}

function show(id){
document.querySelectorAll(".container>section").forEach(s=>s.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
if(id==="cart")renderCart();
if(id==="myorders")renderMyOrders();
if(id==="admin")renderAdmin();
if(id==="seller")renderSeller();
}

function renderProducts(){
let q=document.getElementById("search").value.toLowerCase();
let c=document.getElementById("category").value;
let list=products.filter(p=>(c==="All"||p.cat===c)&&p.name.toLowerCase().includes(q));
document.getElementById("products").innerHTML=list.map(p=>`
<div class="card">
<img src="${p.img||fallback(p.cat)}" onerror="this.src='${fallback(p.cat)}'">
<h3>${p.name}</h3>
<p class="price">₹${p.price}</p>
<button onclick="addCart(${p.id})">Add to Cart</button>
</div>`).join("")||"कोई सामान नहीं मिला";
}

function fallback(cat){
return cat==="Grocery"
?"https://images.unsplash.com/photo-1542838132-92c53300491e?w=500"
:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500";
}

function addCart(id){
let p=products.find(x=>x.id===id);
let item=cart.find(x=>x.id===id);
if(item)item.qty++;
else cart.push({...p,qty:1});
save();updateCount();alert("Cart में Add हो गया!");
}

function updateCount(){
document.getElementById("count").textContent=cart.reduce((a,b)=>a+b.qty,0);
}

function renderCart(){
let box=document.getElementById("cartitems");
box.innerHTML=cart.map(p=>`
<div class="panel">
<b>${p.name}</b> ₹${p.price} × ${p.qty}
<button onclick="changeQty(${p.id},1)">+</button>
<button class="secondary" onclick="changeQty(${p.id},-1)">−</button>
<button class="danger" onclick="removeCart(${p.id})">Remove</button>
</div>`).join("")||"Cart खाली है";
document.getElementById("total").textContent="Total: ₹"+cart.reduce((a,b)=>a+b.price*b.qty,0);
}

function changeQty(id,n){
let p=cart.find(x=>x.id===id);
if(p)p.qty+=n;
cart=cart.filter(x=>x.qty>0);
save();renderCart();updateCount();
}

function removeCart(id){
cart=cart.filter(x=>x.id!==id);
save();renderCart();updateCount();
}

function placeOrder(){
if(!cart.length)return alert("Cart खाली है");
let name=document.getElementById("customer").value.trim();
let phone=document.getElementById("phone").value.trim();
let address=document.getElementById("address").value.trim();
if(!name||!phone||!address)return alert("सभी Delivery Details भरें");

let order={
id:Date.now(),
name,phone,address,
items:cart.map(x=>({...x})),
total:cart.reduce((a,b)=>a+b.price*b.qty,0),
status:"Pending",
date:new Date().toLocaleString()
};
orders.unshift(order);
cart=[];save();updateCount();
alert("Order Demo में Place हो गया!");
show("myorders");
}

function renderMyOrders(){
document.getElementById("myorderlist").innerHTML=orders.map(o=>`
<div class="panel">
<b>Order #${o.id}</b><br>
${o.items.map(i=>i.name+" × "+i.qty).join(", ")}<br>
Total ₹${o.total}<br>
Status: <b>${o.status}</b><br>
${o.date}
</div>`).join("")||"अभी कोई Order नहीं";
}

function login(){
let u=document.getElementById("username").value;
let p=document.getElementById("password").value;
if(u==="admin"&&p==="1234"){
role="admin";show("admin");
}else if(u==="shop"&&p==="1234"){
role="shop";show("seller");
}else alert("गलत Login Details");
}

function logout(){
role="";show("shop");
}

function renderAdmin(){
document.getElementById("adminorders").innerHTML=orders.map(o=>`
<div class="panel">
Order #${o.id}<br>${o.name} | ${o.phone}<br>${o.address}<br>
₹${o.total} | ${o.status}
<select onchange="setStatus(${o.id},this.value)">
${["Pending","Accepted","Preparing","Out for Delivery","Delivered","Rejected"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}
</select>
</div>`).join("")||"No Orders";

document.getElementById("adminproducts").innerHTML=products.map(p=>`
<div class="panel">${p.name} ₹${p.price}
<button class="danger" onclick="deleteProduct(${p.id})">Delete</button>
</div>`).join("");
}

function renderSeller(){
document.getElementById("sellerorders").innerHTML=orders.map(o=>`
<div class="panel">
Order #${o.id}<br>${o.name}<br>${o.address}<br>
₹${o.total}<br><b>${o.status}</b><br>
<button onclick="setStatus(${o.id},'Accepted')">Accept</button>
<button class="danger" onclick="setStatus(${o.id},'Rejected')">Reject</button>
<button class="secondary" onclick="setStatus(${o.id},'Preparing')">Preparing</button>
<button onclick="setStatus(${o.id},'Out for Delivery')">Dispatch</button>
<button onclick="setStatus(${o.id},'Delivered')">Delivered</button>
</div>`).join("")||"No Orders";
}

function setStatus(id,status){
let o=orders.find(x=>x.id===id);
if(o)o.status=status;
save();
renderAdmin();renderSeller();renderMyOrders();
}

function addProduct(){
let name=document.getElementById("pname").value.trim();
let price=Number(document.getElementById("pprice").value);
let cat=document.getElementById("pcat").value;
let img=document.getElementById("pimg").value.trim();
if(!name||price<=0)return alert("Name और सही Price डालें");
products.push({id:Date.now(),name,price,cat,img});
save();renderAdmin();renderProducts();
alert("Product Added");
}

function deleteProduct(id){
if(confirm("Product Delete करें?")){
products=products.filter(p=>p.id!==id);
save();renderAdmin();renderProducts();
}
}

renderProducts();
updateCount();
</script>
</body>
</html>
