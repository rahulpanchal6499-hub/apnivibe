<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApniVibe | Food & Grocery</title>
<style>
:root{--green:#16834a;--dark:#17251d;--muted:#66736b;--line:#e6ece8;--bg:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--dark)}
header{background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);padding:12px max(16px,calc((100% - 1180px)/2))}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:900;font-size:24px;color:var(--green)}
.search{flex:1;min-width:190px;padding:12px 15px;border:1px solid var(--line);border-radius:12px;font-size:16px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nav button,.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer;font-weight:650}
.nav button.active,.primary{background:var(--green);color:#fff;border-color:var(--green)}
main{max-width:1180px;margin:auto;padding:20px 16px 90px}
.hero{background:linear-gradient(110deg,#e3f4e9,#fff);border-radius:18px;padding:24px;margin-bottom:20px}
.hero h1{margin:0 0 7px;font-size:clamp(24px,4vw,36px)}
.muted{color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.section-head h2{margin:0;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.photo{height:138px;background:#edf2ee;display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:11px;display:flex;flex-direction:column;gap:7px;flex:1}
.name{font-weight:750;line-height:1.25}
.meta{font-size:12px;color:var(--muted)}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
.price{font-weight:850}
.add{border:0;background:var(--green);color:white;border-radius:9px;padding:8px 12px;font-weight:750;cursor:pointer}
.empty{background:#fff;padding:28px;text-align:center;border-radius:14px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:5px 0 12px;font:inherit}
.btn{padding:10px 15px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--green);color:#fff}
.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:7px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:10px;padding:10px;z-index:6}
.bottom button{flex:1;max-width:220px}
.hide{display:none!important}
.tag{font-size:11px;background:#edf7f0;color:#17663c;padding:4px 8px;border-radius:99px;width:max-content}
@media(max-width:800px){
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photo{height:125px}
main{padding:14px 12px 90px}
.hero{padding:18px}
.section-head h2{font-size:19px}
}
@media(max-width:380px){.photo{height:105px}.info{padding:9px}.add{padding:7px 9px}}
</style>
</head>
<body>

<header>
<div class="top">
<div class="brand">ApniVibe</div>
<input id="search" class="search" placeholder="Search: Onion Pizza, atta, dal..." aria-label="Search products">
<button class="btn" onclick="showPage('cart')">🛒 Cart <b id="cartCount">0</b></button>
</div>
<nav class="nav">
<button id="nav-home" class="active" onclick="showPage('home')">Home</button>
<button id="nav-grocery" onclick="showPage('grocery')">Grocery</button>
<button id="nav-food" onclick="showPage('food')">Fast Food</button>
<button id="nav-orders" onclick="showPage('orders')">My Orders</button>
<button id="nav-account" onclick="showPage('account')">Account / Settings</button>
</nav>
</header>

<main>
<section id="homePage">
<div class="hero">
<h1>हर दिन की खरीदारी, अब आसान</h1>
<div class="muted">Food और Grocery एक ही जगह • Search करें • Cart में जोड़ें</div>
</div>
<div id="homeSections"></div>
</section>

<section id="catalogPage" class="hide">
<div class="section-head">
<h2 id="catalogTitle"></h2>
<span class="muted" id="resultCount"></span>
</div>
<div id="catalogGrid" class="grid"></div>
</section>

<section id="cartPage" class="hide">
<div class="section-head"><h2>आपका Cart</h2></div>
<div class="panel" id="cartContents"></div>
</section>

<section id="ordersPage" class="hide">
<div class="section-head"><h2>My Orders</h2></div>
<div id="ordersContents"></div>
</section>

<section id="accountPage" class="hide">
<div class="section-head"><h2>Account & Settings</h2></div>
<div class="panel">
<h3>Customer Login</h3>
<p class="muted">यह अभी स्थानीय Demo Profile है। सुरक्षित Login के लिए Backend जरूरी है।</p>
<label>Email</label>
<input id="email" class="field" type="email" placeholder="you@example.com">
<label>Password</label>
<input id="password" class="field" type="password" placeholder="Password">
<button class="btn primary" onclick="login()">Login / Save Profile</button>
<button class="btn" onclick="logout()">Logout</button>
<p id="loginState" class="muted"></p>
</div>
</section>
</main>

<div class="bottom">
<button class="btn" onclick="showPage('grocery')">🛍 Grocery</button>
<button class="btn" onclick="showPage('food')">🍕 Fast Food</button>
<button class="btn primary" onclick="showPage('cart')">🛒 Cart</button>
</div>

<script>
const raw=[
['Onion Pizza','Food','Pizza',249,'onion pizza'],
['Double Onion Pizza','Food','Pizza',299,'double onion pizza'],
['Cheese Pizza','Food','Pizza',229,'cheese pizza'],
['Paneer Pizza','Food','Pizza',279,'paneer pizza'],
['Margherita Pizza','Food','Pizza',199,'margherita pizza'],
['Farmhouse Pizza','Food','Pizza',329,'farmhouse pizza'],
['Veg Supreme Pizza','Food','Pizza',319,'veg supreme pizza'],
['Corn Pizza','Food','Pizza',239,'corn pizza'],
['Aloo Tikki Burger','Food','Burger',79,'aloo tikki burger'],
['Cheese Burger','Food','Burger',99,'cheese burger'],
['Paneer Burger','Food','Burger',129,'paneer burger'],
['Double Patty Burger','Food','Burger',149,'double patty burger'],
['Veg Maharaja Burger','Food','Burger',159,'veg maharaja burger'],
['Crispy Veg Burger','Food','Burger',109,'crispy veg burger'],
['Mexican Burger','Food','Burger',139,'mexican burger'],
['Classic Veg Burger','Food','Burger',89,'classic veg burger'],
['Veg Momos','Food','Momos',89,'veg momos'],
['Paneer Momos','Food','Momos',119,'paneer momos'],
['Fried Momos','Food','Momos',109,'fried momos'],
['Tandoori Momos','Food','Momos',139,'tandoori momos'],
['Hakka Noodles','Food','Chinese',129,'hakka noodles'],
['Schezwan Noodles','Food','Chinese',149,'schezwan noodles'],
['Veg Manchurian','Food','Chinese',139,'veg manchurian'],
['Chilli Paneer','Food','Chinese',179,'chilli paneer'],
['White Sauce Pasta','Food','Pasta',159,'white sauce pasta'],
['Red Sauce Pasta','Food','Pasta',149,'red sauce pasta'],
['Masala Dosa','Food','South Indian',99,'masala dosa'],
['Idli Sambar','Food','South Indian',69,'idli sambar'],
['Veg Thali','Food','Thali',169,'indian veg thali'],
['Paneer Thali','Food','Thali',199,'paneer thali'],
['French Fries','Food','Snacks',89,'french fries'],
['Veg Sandwich','Food','Snacks',99,'veg sandwich'],
['Cold Coffee','Food','Drinks',99,'cold coffee'],
['Gulab Jamun','Food','Dessert',69,'gulab jamun'],
['Wheat Atta 5 kg','Grocery','Atta & Flour',245,'wheat flour atta bag'],
['Besan 1 kg','Grocery','Atta & Flour',95,'besan flour packet'],
['Maida 1 kg','Grocery','Atta & Flour',48,'maida flour packet'],
['Sooji 1 kg','Grocery','Atta & Flour',55,'sooji semolina packet'],
['Basmati Rice 1 kg','Grocery','Rice',115,'basmati rice packet'],
['Sona Masoori Rice 5 kg','Grocery','Rice',330,'sona masoori rice bag'],
['Toor Dal 1 kg','Grocery','Pulses',165,'toor dal packet'],
['Moong Dal 1 kg','Grocery','Pulses',135,'moong dal packet'],
['Masoor Dal 1 kg','Grocery','Pulses',110,'masoor dal packet'],
['Chana Dal 1 kg','Grocery','Pulses',95,'chana dal packet'],
['Iodized Salt 1 kg','Grocery','Essentials',25,'iodized salt packet'],
['Sugar 1 kg','Grocery','Essentials',48,'sugar packet'],
['Jaggery 1 kg','Grocery','Essentials',75,'jaggery'],
['Refined Oil 1 L','Grocery','Oil & Ghee',145,'cooking oil bottle'],
['Mustard Oil 1 L','Grocery','Oil & Ghee',165,'mustard oil bottle'],
['Ghee 500 ml','Grocery','Oil & Ghee',285,'ghee jar'],
['Turmeric Powder 200 g','Grocery','Spices',45,'turmeric powder packet'],
['Red Chilli Powder 200 g','Grocery','Spices',65,'red chilli powder packet'],
['Garam Masala 100 g','Grocery','Spices',55,'garam masala packet'],
['Tea 500 g','Grocery','Beverages',175,'tea packet'],
['Milk 1 L','Grocery','Dairy',60,'milk pouch'],
['Curd 400 g','Grocery','Dairy',40,'curd cup'],
['Paneer 200 g','Grocery','Dairy',85,'paneer pack'],
['Eggs 6 pcs','Grocery','Daily Needs',48,'eggs carton'],
['Potato 1 kg','Grocery','Vegetables',30,'potatoes'],
['Onion 1 kg','Grocery','Vegetables',35,'onions'],
['Tomato 1 kg','Grocery','Vegetables',40,'tomatoes'],
['Banana 1 dozen','Grocery','Fruits',55,'banana'],
['Apple 1 kg','Grocery','Fruits',160,'apples']
].map((x,i)=>({
id:i+1,name:x[0],type:x[1],cat:x[2],
price:x[3],photo:x[4],available:true
}));

let cart=JSON.parse(localStorage.getItem('av_cart')||'{}');
let orders=JSON.parse(localStorage.getItem('av_orders')||'[]');
let profile=JSON.parse(localStorage.getItem('av_profile')||'null');
let page='home',query='';

const money=n=>'₹'+n.toFixed(0);

function save(){
localStorage.setItem('av_cart',JSON.stringify(cart));
localStorage.setItem('av_orders',JSON.stringify(orders));
localStorage.setItem('av_profile',JSON.stringify(profile));
updateCount();
}

function photoUrl(p){
return 'https://source.unsplash.com/600x400/?'+
encodeURIComponent(p.photo+', food product photography');
}

function card(p){
return `<article class="card">
<div class="photo">
<img loading="lazy" src="${photoUrl(p)}" alt="${p.name}"
onerror="this.style.display='none';this.parentElement.innerHTML='<span>🛍️</span>'">
</div>
<div class="info">
<div class="tag">${p.cat}</div>
<div class="name">${p.name}</div>
<div class="meta">${p.type}</div>
<div class="price-row">
<span class="price">${money(p.price)}</span>
<button class="add" onclick="add(${p.id})">+ Add</button>
</div>
</div>
</article>`;
}

function renderGrid(el,items){
el.innerHTML=items.length
?items.map(card).join('')
:'<div class="empty" style="grid-column:1/-1">कोई सामान नहीं मिला। दूसरा नाम Search करें।</div>';
}

function section(title,items){
return `<div class="section-head">
<h2>${title}</h2><span class="muted">${items.length} items</span>
</div><div class="grid">${items.map(card).join('')}</div>`;
}

function home(){
let f=raw.filter(p=>p.type==='Food');
let g=raw.filter(p=>p.type==='Grocery');
document.getElementById('homeSections').innerHTML=
section('Fast Food • Popular & More',f)+
section('Grocery • Daily Essentials',g);
}

function showPage(p){
page=p;
['home','catalog','cart','orders','account'].forEach(x=>{
document.getElementById(x+'Page').classList.toggle(
'hide',!(x===p||((p==='food'||p==='grocery')&&x==='catalog'))
);
});
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
document.getElementById('nav-'+p)?.classList.add('active');

if(p==='food'||p==='grocery'){
document.getElementById('catalogTitle').textContent=
p==='food'?'Fast Food – सभी Items':'Grocery – सभी Items';
renderCatalog();
}
if(p==='cart')renderCart();
if(p==='orders')renderOrders();
if(p==='account'){
document.getElementById('loginState').textContent=
profile?'Logged in as '+profile.email:'अभी Login नहीं है';
}
}

function renderCatalog(){
let items=raw.filter(p=>
(p.type===(page==='food'?'Food':'Grocery'))&&matches(p)
);
document.getElementById('resultCount').textContent=items.length+' items';
renderGrid(document.getElementById('catalogGrid'),items);
}

function matches(p){
let q=query.trim().toLowerCase();
return !q||(p.name+' '+p.cat+' '+p.type).toLowerCase().includes(q);
}

function add(id){
cart[id]=(cart[id]||0)+1;
save();
if(page==='cart')renderCart();
}

function updateCount(){
document.getElementById('cartCount').textContent=
Object.values(cart).reduce((a,b)=>a+b,0);
}

function renderCart(){
let entries=Object.entries(cart)
.filter(([id,q])=>q>0)
.map(([id,q])=>({p:raw.find(x=>x.id==id),q}));
let total=entries.reduce((s,x)=>s+x.p.price*x.q,0);

document.getElementById('cartContents').innerHTML=entries.length
?entries.map(({p,q})=>`
<div class="cart-line">
<div><b>${p.name}</b><div class="muted">${money(p.price)} each</div></div>
<div class="qty">
<button onclick="changeQty(${p.id},-1)">−</button>
${q}
<button onclick="changeQty(${p.id},1)">+</button>
</div>
<b>${money(p.price*q)}</b>
</div>`).join('')+
`<h3>Total: ${money(total)}</h3>
<button class="btn primary" onclick="checkout()">Place Order</button>`
:'<div class="empty">Cart खाली है। Grocery या Fast Food से सामान जोड़ें।</div>';
}

function changeQty(id,d){
cart[id]=(cart[id]||0)+d;
if(cart[id]<=0)delete cart[id];
save();
renderCart();
}

function checkout(){
if(!profile){
alert('Order करने से पहले Account / Settings में Login करें।');
showPage('account');
return;
}
let items=Object.entries(cart).map(([id,q])=>({
name:raw.find(p=>p.id==id).name,
qty:q,
price:raw.find(p=>p.id==id).price
}));
if(!items.length)return;

let total=items.reduce((s,x)=>s+x.qty*x.price,0);
let address=prompt('Delivery address लिखें:');
if(!address)return;

orders.unshift({
id:'AV'+Date.now(),
date:new Date().toLocaleString('en-IN'),
items,total,address,status:'Received'
});
cart={};
save();
alert('Order इस browser में save हुआ। यह अभी वास्तविक delivery server पर नहीं गया है।');
showPage('orders');
}

function renderOrders(){
document.getElementById('ordersContents').innerHTML=orders.length
?orders.map(o=>`
<div class="panel">
<b>${o.id}</b> • ${o.date}
<p>${o.items.map(i=>i.name+' × '+i.qty).join(', ')}</p>
<b>${money(o.total)}</b>
<p class="muted">${o.address} • ${o.status}</p>
<button class="btn" onclick="reorder('${o.id}')">Reorder</button>
</div>`).join('')
:'<div class="empty">अभी कोई Order History नहीं है।</div>';
}

function reorder(id){
let o=orders.find(x=>x.id===id);
o.items.forEach(i=>{
let p=raw.find(p=>p.name===i.name);
if(p)cart[p.id]=(cart[p.id]||0)+i.qty;
});
save();
showPage('cart');
}

function login(){
let e=document.getElementById('email').value.trim();
let p=document.getElementById('password').value;
if(!e||!p){
alert('Email और Password भरें');
return;
}
profile={email:e};
save();
document.getElementById('loginState').textContent=
'Profile saved: '+e+' (यह सुरक्षित server login नहीं है)';
}

function logout(){
profile=null;
save();
document.getElementById('loginState').textContent='Logout हो गया।';
}

document.getElementById('search').addEventListener('input',e=>{
query=e.target.value;
if(page==='home'){
document.getElementById('homeSections').innerHTML=
section('Search Results',raw.filter(matches));
}else if(page==='food'||page==='grocery'){
renderCatalog();
}else{
showPage('home');
document.getElementById('homeSections').innerHTML=
section('Search Results',raw.filter(matches));
}
});

home();
updateCount();
</script>
</body>
</html>
